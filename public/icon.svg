<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card with Smooth Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Neon Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Main Camera Studio & Store Icon -->
  <g transform="translate(106, 116)">
    <!-- Camera Body / Product Display -->
    <rect x="20" y="70" width="260" height="190" rx="36" fill="url(#accentGrad)" filter="url(#glow)"/>
    
    <!-- Camera Top Lens Flash Bump -->
    <path d="M 90 70 L 110 35 Q 115 30 125 30 L 175 30 Q 185 30 190 35 L 210 70 Z" fill="url(#accentGrad)"/>
    
    <!-- Camera Inner Ring / Lens Studio -->
    <circle cx="150" cy="165" r="62" fill="#0F172A" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="150" cy="165" r="42" fill="url(#accentGrad)"/>
    <circle cx="150" cy="165" r="26" fill="#0F172A"/>

    <!-- Lens Reflection Spot -->
    <circle cx="138" cy="153" r="8" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Flash Light Dot -->
    <circle cx="235" cy="105" r="10" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- AI Magic Sparkle 1 (Top Right) -->
  <path d="M 390 80 Q 390 120 430 120 Q 390 120 390 160 Q 390 120 350 120 Q 390 120 390 80 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- AI Magic Sparkle 2 (Bottom Left) -->
  <path d="M 90 340 Q 90 365 115 365 Q 90 365 90 390 Q 90 365 65 365 Q 90 365 90 340 Z" fill="url(#goldGrad)"/>

  <!-- AI Magic Sparkle 3 (Small Top) -->
  <path d="M 270 55 Q 270 70 285 70 Q 270 70 270 85 Q 270 70 255 70 Q 270 70 270 55 Z" fill="#FFFFFF"/>

  <!-- "PRO" Badge at Bottom Right -->
  <g transform="translate(310, 360)">
    <rect width="130" height="54" rx="16" fill="#F43F5E" stroke="#FFFFFF" stroke-width="3" filter="url(#glow)"/>
    <text x="65" y="37" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="2">PRO</text>
  </g>
</svg>
